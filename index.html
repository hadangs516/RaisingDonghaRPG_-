      "설마 신기록이냐 꿀... 재수없다.",
      "인정한다 꿀, 오늘은 너가 이겼다.",
      "다음엔 진짜 안 봐준다 꿀!",
      "이번만이다 꿀, 다음엔 안 통해.",
      "억울하지만 잘했다 꿀...",
      "{닉네임} 무섭게 하네 꿀.",
      "오늘따라 눈치가 빠르네 꿀.",
      "기록 갱신이라니, 열받는다 꿀.",
      "다음 판엔 진짜 각오해라 꿀."
    ]
  };
  var lastIdx = {};
  function say(category){
    var arr = DIALOGUE[category];
    if(!arr || !arr.length) return;
    var idx;
    do { idx = Math.floor(Math.random()*arr.length); } while (arr.length>1 && idx===lastIdx[category]);
    lastIdx[category] = idx;
    var text = arr[idx].split('{닉네임}').join(state.nickname);
    speechBubble.textContent = text;
  }

  var GAMEOVER_TITLES = [
    "다이어트 실패!",
    "돼지 압승",
    "결국 다 뺏겼다",
    "오늘 밥상은 돼지 거였다",
    "완패...",
    "동하가 승리했다",
    "지방으로 항복",
    "밥그릇 사수 실패",
    "동하 배터짐 주의보"
  ];

  // ===== 상점 설정 =====
  var SHOP = {
    fatdown: { baseCost: 80, mult: 1.7, effect: 20 },
    exposure: { costs: [120,220,380], effect: 0.15, max: 3 },
    coinup: { costs: [100,200,360], effect: 3, max: 3 },
    slow: { costs: [150,280,480], effect: 0.15, max: 3 }
  };

  var FOOD_TIERS = [
    { icons:['🍎','🥕','🍇','🥦'], hits:1, coin:10, fat:5 },
    { icons:['🍞','🌭','🍕','🥐'], hits:1, coin:14, fat:10 },
    { icons:['🍗','🥩','🍰','🍩'], hits:2, coin:20, fat:15 },
    { icons:['🍔','🌮','🍜','🧁'], hits:3, coin:28, fat:20 }
  ];

  // ===== 상태 =====
  function freshState(nickname, bestRecord){
    return {
      nickname: nickname,
      bestRecord: bestRecord || 0,
      coin: 0,
      fat: 0,
      elapsed: 0,
      combo: 0,
      running: false,
      bossActive: false,
      shopLv: { exposure:0, coinup:0, slow:0 },
      fatdownCount: 0,
      activeFoods: [],
      occupied: new Array(9).fill(false),
      bossTriggeredMarks: {}
    };
  }
  var state = freshState('', 0);

  var spawnTimer = null, tickTimer = null, bossBiteTimer = null;
  var bossEl = null, bossSize = 100;

  // ===== 그릇 9개 생성 =====
  for (var i=0;i<9;i++){
    var b = document.createElement('div');
    b.className = 'bowl';
    b.dataset.idx = i;
    tableEl.appendChild(b);
  }
  var bowlEls = Array.prototype.slice.call(tableEl.querySelectorAll('.bowl'));

  // ===== API =====
  function apiCall(action, payload){
    payload = payload || {};
    payload.action = action;
    return fetch(GAS_URL, { method:'POST', body: JSON.stringify(payload) })
      .then(function(res){ return res.json(); })
      .catch(function(err){ console.warn('API 오류', err); return { success:false }; });
  }

  // ===== 로그인 =====
  loginBtn.addEventListener('click', handleLogin);
  function handleLogin(){
    var nickname = nicknameInput.value.trim();
    var pin = pinInput.value.trim();
    if(!/^[가-힣]{2,8}$/.test(nickname)){
      loginError.textContent = '닉네임은 한글 2~8자로 입력해줘';
      return;
    }
    if(!/^\d{4}$/.test(pin)){
      loginError.textContent = 'PIN은 숫자 4자리로 입력해줘';
      return;
    }
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = '로그인 중...';
    apiCall('login', { nickname: nickname, pin: pin }).then(function(data){
      loginBtn.disabled = false;
      loginBtn.textContent = '시작하기';
      if(!data || !data.success){
        loginError.textContent = (data && data.message) || '로그인에 실패했어. 다시 시도해줘';
        return;
      }
      state = freshState(nickname, data.bestRecord || 0);
      loginScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      apiCall('startRound', { nickname: nickname });
      startRun();
    });
  }

  // ===== 난이도 계산 =====
  function difficultyFactor(){ return Math.max(0.4, 1 - SHOP.slow.effect*state.shopLv.slow); }
  function scaledElapsed(){ return state.elapsed * difficultyFactor(); }
  function currentTier(){
    var e = scaledElapsed();
    if (e < 20) return 0;
    if (e < 50) return 1;
    if (e < 95) return 2;
    return 3;
  }
  function currentExposureMs(){
    var e = scaledElapsed();
    var base = Math.max(0.37, 1.05 - e*0.0056);
    return (base + state.shopLv.exposure*SHOP.exposure.effect) * 1000;
  }
  function currentFallMs(){
    var e = scaledElapsed();
    return Math.max(0.75, 1.55 - e*0.0045) * 1000;
  }
  function currentSimultaneous(){
    var e = scaledElapsed();
    return Math.min(3, 1 + Math.floor(e/27));
  }
  function fatPenalty(tierIdx){
    var base = FOOD_TIERS[tierIdx].fat;
    var growth = 1 + state.elapsed/120;
    return Math.round(base*growth);
  }

  // ===== 런 시작/재시작 =====
  function startRun(){
    state.coin = 0; state.fat = 0; state.elapsed = 0; state.combo = 0;
    state.shopLv = { exposure:0, coinup:0, slow:0 };
    state.fatdownCount = 0;
    state.occupied = new Array(9).fill(false);
    state.bossTriggeredMarks = {};
    clearAllFoods();
    updateHud();
    updateShopUi();
    say('start');
    state.running = true;
    scheduleTick();
    scheduleSpawn();
  }

  function scheduleTick(){
    tickTimer = setInterval(function(){
      if(!state.running) return;
      state.elapsed += 1;
      updateHud();
      checkBossTrigger();
    }, 1000);
  }

  function scheduleSpawn(){
    if(!state.running) return;
    var delay = 300 + Math.random()*300;
    spawnTimer = setTimeout(function(){
      trySpawn();
      scheduleSpawn();
    }, delay);
  }

  function clearAllFoods(){
    state.activeFoods.forEach(function(f){
      if(f.timeout) clearTimeout(f.timeout);
      if(f.el && f.el.parentNode) f.el.parentNode.removeChild(f.el);
    });
    state.activeFoods = [];
    state.occupied = new Array(9).fill(false);
  }

  // ===== 스폰/낙하 =====
  function trySpawn(){
    if(state.bossActive) return;
    var need = currentSimultaneous();
    if(state.activeFoods.length >= need) return;
    var free = [];
    for(var i=0;i<9;i++){ if(!state.occupied[i]) free.push(i); }
    if(free.length === 0) return;
    var bowlIdx = free[Math.floor(Math.random()*free.length)];
    spawnFood(bowlIdx);
  }

  function spawnFood(bowlIdx){
    var tierIdx = currentTier();
    var tier = FOOD_TIERS[tierIdx];
    var icon = tier.icons[Math.floor(Math.random()*tier.icons.length)];

    var el = document.createElement('div');
    el.className = 'food';
    el.textContent = icon;
    board.appendChild(el);

    var bowlRect = bowlEls[bowlIdx].getBoundingClientRect();
    var boardRect = board.getBoundingClientRect();
    var targetLeft = bowlRect.left - boardRect.left + bowlRect.width/2;
    var targetTop = bowlRect.top - boardRect.top + bowlRect.height/2;

    el.style.left = targetLeft + 'px';
    el.style.top = '-30px';

    var fallMs = currentFallMs();
    var food = {
      el: el, bowlIdx: bowlIdx, tierIdx: tierIdx, hitsLeft: tier.hits, totalHits: tier.hits,
      landed: false, resolved: false, timeout: null
    };
    state.activeFoods.push(food);
    state.occupied[bowlIdx] = true;

    requestAnimationFrame(function(){
      el.style.transition = 'top ' + (fallMs/1000) + 's linear';
      requestAnimationFrame(function(){ el.style.top = targetTop + 'px'; });
    });

    setTimeout(function(){
      if(!state.running) return;
      food.landed = true;
      el.classList.add('landed');
      el.addEventListener('click', function(){ onFoodClick(food); });
      var expMs = currentExposureMs();
      food.timeout = setTimeout(function(){ onFoodMiss(food); }, expMs);
    }, fallMs);
  }

  function removeFood(food){
    var idx = state.activeFoods.indexOf(food);
    if(idx>=0) state.activeFoods.splice(idx,1);
    state.occupied[food.bowlIdx] = false;
    if(food.el && food.el.parentNode) food.el.parentNode.removeChild(food.el);
  }

  function onFoodClick(food){
    if(!state.running || !food.landed || food.resolved) return;
    food.hitsLeft -= 1;
    if(food.hitsLeft > 0){
      var scale = 0.4 + 0.6*(food.hitsLeft/food.totalHits);
      food.el.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
      playTone(520, 0.05, 'square');
      return;
    }
    food.resolved = true;
    if(food.timeout) clearTimeout(food.timeout);
    var tier = FOOD_TIERS[food.tierIdx];
    state.combo += 1;
    var comboBonus = Math.min(state.combo - 1, 10) * 2;
    var coinGain = tier.coin + state.shopLv.coinup*SHOP.coinup.effect + comboBonus;
    state.coin += coinGain;
    var rect = food.el.getBoundingClientRect();
    var boardRect = board.getBoundingClientRect();
    reactSuccess(rect.left - boardRect.left, rect.top - boardRect.top, coinGain, state.combo);
    say('success');
    removeFood(food);
    updateHud();
  }

  function onFoodMiss(food){
    if(!state.running || food.resolved) return;
    food.resolved = true;
    state.combo = 0;
    var pen = fatPenalty(food.tierIdx);
    state.fat = Math.min(100, state.fat + pen);
    var rect = food.el.getBoundingClientRect();
    var boardRect = board.getBoundingClientRect();
    reactMiss(rect.left - boardRect.left, rect.top - boardRect.top);
    say('miss');
    removeFood(food);
    updateHud();
    checkDeath();
  }

  // ===== 이펙트 =====
  function reactSuccess(x, y, coinGain, combo){
    board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    var label = combo >= 3 ? ('+' + coinGain + ' 콤보x' + combo) : ('+' + coinGain);
    spawnPopup(x, y, label, '#ffab00');
    spawnParticles(x, y);
    playTone(880 + Math.min(combo,10)*15, 0.1, 'sine');
  }
  function reactMiss(x, y){
    playTone(180, 0.15, 'sawtooth');
    spawnPopup(x, y, '냠', '#ef5350');
    flashLayer.classList.remove('flash'); void flashLayer.offsetWidth; flashLayer.classList.add('flash');
  }
  function spawnPopup(x, y, text, color){
    var p = document.createElement('div');
    p.className = 'popup';
    p.textContent = text;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.color = color;
    board.appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 850);
  }
  function spawnParticles(x, y){
    for(var i=0;i<6;i++){
      var pt = document.createElement('div');
      pt.className = 'particle';
      pt.style.left = x + 'px';
      pt.style.top = y + 'px';
      var ang = Math.random()*Math.PI*2, dist = 20+Math.random()*20;
      pt.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      pt.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      board.appendChild(pt);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 520); })(pt);
    }
  }

  // ===== 보스전 =====
  function checkBossTrigger(){
    var mark = Math.floor(state.elapsed/60)*60;
    if(mark > 0 && state.elapsed % 60 === 0 && !state.bossTriggeredMarks[mark] && !state.bossActive){
      state.bossTriggeredMarks[mark] = true;
      triggerBoss();
    }
  }

  function triggerBoss(){
    state.bossActive = true;
    if(spawnTimer) clearTimeout(spawnTimer);
    clearAllFoods();
    speechBubble.textContent = "오늘은 특별식이다 꿀!! 대왕버거 내놔라!!";

    bossSize = 100;
    bossEl = document.createElement('div');
    bossEl.className = 'boss-food';
    bossEl.innerHTML = '<span class="emoji">🍔</span><div class="boss-hpbar"><div class="boss-hpbar-fill"></div></div>';
    var tableRect = tableEl.getBoundingClientRect();
    var boardRect = board.getBoundingClientRect();
    var targetLeft = tableRect.left - boardRect.left + tableRect.width/2;
    var targetTop = tableRect.top - boardRect.top + tableRect.height/2;

    bossEl.style.left = targetLeft + 'px';
    bossEl.style.top = '-80px';
    board.appendChild(bossEl);
    updateBossVisual();

    var fallMs = 900;
    requestAnimationFrame(function(){
      bossEl.style.transition = 'top ' + (fallMs/1000) + 's ease-in';
      requestAnimationFrame(function(){ bossEl.style.top = targetTop + 'px'; });
    });

    setTimeout(function(){
      if(!state.bossActive || !bossEl) return;

      bossEl.querySelector('.emoji').addEventListener('click', function(){
        if(!state.bossActive) return;
        bossSize -= 10;
        playTone(700, 0.07, 'triangle');
        spawnParticles(parseFloat(bossEl.style.left), parseFloat(bossEl.style.top));
        updateBossVisual();
        if(bossSize <= 0) endBoss();
      });

      bossBiteTimer = setInterval(function(){
        if(!state.bossActive) return;
        bossSize -= 6;
        state.fat = Math.min(100, state.fat + 4);
        updateHud();
        updateBossVisual();
        checkDeath();
        if(bossSize <= 0) endBoss();
      }, 1000);
    }, fallMs);
  }

  function updateBossVisual(){
    if(!bossEl) return;
    var pct = Math.max(0, bossSize);
    var tableRect = tableEl.getBoundingClientRect();
    var maxSize = Math.min(tableRect.width, tableRect.height) * 0.98;
    var minSize = maxSize * 0.15;
    var size = minSize + (maxSize - minSize) * (pct/100);
    bossEl.querySelector('.emoji').style.fontSize = size + 'px';
    bossEl.querySelector('.boss-hpbar-fill').style.width = pct + '%';
  }

  function endBoss(){
    state.bossActive = false;
    if(bossBiteTimer) clearInterval(bossBiteTimer);
    if(bossEl && bossEl.parentNode) bossEl.parentNode.removeChild(bossEl);
    bossEl = null;
    if(state.running){
      say('miss');
      scheduleSpawn();
    }
  }

  // ===== 사망 처리 =====
  function checkDeath(){
    if(state.fat >= 100 && state.running){
      state.fat = 100;
      updateHud();
      gameOver();
    }
  }

  function gameOver(){
    state.running = false;
    if(spawnTimer) clearTimeout(spawnTimer);
    if(tickTimer) clearInterval(tickTimer);
    if(bossBiteTimer) clearInterval(bossBiteTimer);
    if(bossEl && bossEl.parentNode) bossEl.parentNode.removeChild(bossEl);
    bossEl = null;
    clearAllFoods();
    playTone(140, 0.35, 'square');
    pigEl.classList.add('dead');

    var survival = Math.floor(state.elapsed);
    goTitle.textContent = GAMEOVER_TITLES[Math.floor(Math.random()*GAMEOVER_TITLES.length)];
    goResult.textContent = '이번 판 생존시간: ' + survival + '초';
    goBest.textContent = '최고기록 확인 중...';
    goNewRecord.style.display = 'none';
    gameoverScreen.classList.add('show');

    apiCall('endRound', { nickname: state.nickname, survivalSeconds: survival }).then(function(data){
      var isNew = data && data.isNewRecord;
      var best = (data && typeof data.bestRecord === 'number') ? data.bestRecord : Math.max(state.bestRecord, survival);
      state.bestRecord = best;
      goBest.textContent = '내 최고기록: ' + best + '초';
      goNewRecord.style.display = isNew ? 'block' : 'none';
      if(isNew) playTone(660, 0.2, 'sine');
      updateHud();
    });
  }

  restartBtn.addEventListener('click', function(){
    gameoverScreen.classList.remove('show');
    pigEl.classList.remove('dead');
    apiCall('startRound', { nickname: state.nickname });
    startRun();
  });

  // ===== 상점 =====
  function fatdownCost(){ return Math.round(SHOP.fatdown.baseCost * Math.pow(SHOP.fatdown.mult, state.fatdownCount)); }

  btnFatdown.addEventListener('click', function(){
    var cost = fatdownCost();
    if(state.coin < cost || !state.running) return;
    state.coin -= cost;
    state.fat = Math.max(0, state.fat - SHOP.fatdown.effect);
    state.fatdownCount += 1;
    say('shop');
    updateHud(); updateShopUi();
  });
  btnExposure.addEventListener('click', function(){ buyLeveled('exposure', SHOP.exposure); });
  btnCoinup.addEventListener('click', function(){ buyLeveled('coinup', SHOP.coinup); });
  btnSlow.addEventListener('click', function(){ buyLeveled('slow', SHOP.slow); });

  function buyLeveled(key, cfg){
    if(!state.running) return;
    var lv = state.shopLv[key];
    if(lv >= cfg.max) return;
    var cost = cfg.costs[lv];
    if(state.coin < cost) return;
    state.coin -= cost;
    state.shopLv[key] += 1;
    say('shop');
    updateHud(); updateShopUi();
  }

  function updateShopUi(){
    costFatdown.textContent = fatdownCost() + '원';
    updateLeveledBtn('exposure', costExposure, btnExposure, SHOP.exposure);
    updateLeveledBtn('coinup', costCoinup, btnCoinup, SHOP.coinup);
    updateLeveledBtn('slow', costSlow, btnSlow, SHOP.slow);
  }
  function updateLeveledBtn(key, costEl, btnEl, cfg){
    var lv = state.shopLv[key];
    if(lv >= cfg.max){
      costEl.textContent = 'MAX';
      btnEl.disabled = true;
    } else {
      costEl.textContent = cfg.costs[lv] + '원';
      btnEl.disabled = false;
    }
  }

  // ===== HUD =====
  function updateHud(){
    hudCoin.textContent = Math.floor(state.coin);
    hudBest.textContent = state.elapsed + '초 · 최고 ' + state.bestRecord + '초';
    fatBar.style.width = state.fat + '%';
  }

  // ===== 랭킹 =====
  rankOpenBtn.addEventListener('click', openRanking);
  goRankBtn.addEventListener('click', openRanking);
  rankCloseBtn.addEventListener('click', function(){ rankingScreen.classList.remove('show'); });

  function openRanking(){
    rankingList.innerHTML = '불러오는 중...';
    rankingScreen.classList.add('show');
    apiCall('ranking', { limit: 20 }).then(function(data){
      if(!data || !data.success){ rankingList.innerHTML = '랭킹을 불러오지 못했어'; return; }
      rankingList.innerHTML = '';
      data.ranking.forEach(function(row, i){
        var div = document.createElement('div');
        div.className = 'row' + (row.nickname === state.nickname ? ' me' : '');
        div.innerHTML = '<span>' + (i+1) + '. ' + row.nickname + '</span><span>' + row.bestRecord + '초</span>';
        rankingList.appendChild(div);
      });
      if(data.ranking.length === 0) rankingList.innerHTML = '아직 기록이 없어';
    });
  }

  // ===== 설정/로그아웃 =====
  settingsOpenBtn.addEventListener('click', function(){
    settingsNickname.textContent = '닉네임: ' + state.nickname;
    settingsVersion.textContent = '버전 ' + APP_VERSION;
    settingsScreen.classList.add('show');
  });
  settingsCloseBtn.addEventListener('click', function(){ settingsScreen.classList.remove('show'); });
  logoutBtn.addEventListener('click', logout);
  soundToggleBtn.addEventListener('click', function(){
    soundEnabled = !soundEnabled;
    soundToggleBtn.textContent = soundEnabled ? '사운드 끄기' : '사운드 켜기';
  });

  function logout(){
    state.running = false;
    if(spawnTimer) clearTimeout(spawnTimer);
    if(tickTimer) clearInterval(tickTimer);
    if(bossBiteTimer) clearInterval(bossBiteTimer);
    if(bossEl && bossEl.parentNode) bossEl.parentNode.removeChild(bossEl);
    bossEl = null;
    clearAllFoods();
    settingsScreen.classList.remove('show');
    rankingScreen.classList.remove('show');
    gameoverScreen.classList.remove('show');
    pigEl.classList.remove('dead');
    gameScreen.style.display = 'none';
    nicknameInput.value = '';
    pinInput.value = '';
    loginError.textContent = '';
    loginScreen.style.display = 'flex';
  }

})();
</script>
</body>
</html>
